agents:
  load_profile:
    description: Provides profile details for demonstration.
    template: |
      name: Ada Lovelace
      role: Principal Engineer
      focus: Quarterly roadmap review

  summarize_profile:
    description: Summarises profile information.
    template: |
      Summary: Key accomplishments and upcoming milestones captured.

  profile.summarize_profile:
    description: Library-scoped example for SEND ... IN ... MESSAGE.
    template: |
      Summary (library): Consolidated achievements for the quarter.

  notify_team:
    description: Pretend notifier that consumes lists of tasks.
    template: |
      Notification sent to: delivery@contoso.example
      {{ LIST INPUT }}

  send_message:
    description: Demonstrates `SEND <label> MESSAGE <value>`.
    template: |
      {{ SEND summarize_profile MESSAGE INPUT }}

  send_message_shorthand:
    description: Demonstrates `SEND <label>` shorthand for `MESSAGE INPUT`.
    template: |
      {{ SEND summarize_profile }}

  send_message_library:
    description: Demonstrates `SEND <label> IN <label> MESSAGE <value>`.
    template: |
      {{ SEND summarize_profile IN profile MESSAGE INPUT }}

  send_message_block:
    description: Demonstrates `SEND <label> MESSAGE ... END`.
    template: |
      {{ SEND summarize_profile MESSAGE }}
           This is a summary generated inline.
           It can span multiple lines.
      {{ END }}

  send_list_value:
    description: Demonstrates `SEND <label> LIST <value>`.
    template: |
      {{ LET tasks BE }}
           - Align roadmap
           - Confirm staffing
           - Publish summary
      {{ END }}
      {{ SEND notify_team LIST USE tasks }}

  send_list_block:
    description: Demonstrates `SEND <label> LIST ... END`.
    template: |
      {{ SEND notify_team LIST }}
           - Align roadmap
           - Confirm staffing
           - Publish summary
      {{ END }}

  send_list_nested:
    description: Nested list form where the block calls another agent.
    template: |
      {{ SEND notify_team LIST }}
           {{ SEND summarize_profile MESSAGE }}Roadmap review due.{{ END }}
      {{ END }}

  let_binding:
    description: Demonstrates `LET <label> BE <value>` and `USE <label>`.
    template: |
      {{ LET summary BE SEND summarize_profile MESSAGE INPUT }}
      Summary: {{ USE summary }}

  let_block_binding:
    description: Demonstrates `LET <label> BE ... END`.
    template: |
      {{ LET intro BE }}
           Dear team,
           Thank you for the timely updates today.
      {{ END }}
      {{ USE intro }}
