agents:
  summarize_notes:
    description: Produces a quick summary string.
    template: |
      Summary generated from the latest notes.

  gather_updates:
    description: Returns bullet-form updates.
    template: |
      - Review quarterly roadmap
      - Confirm staffing changes

  using_direct_value:
    description: Demonstrates `LET <label> BE <value>` with `USE <label>`.
    template: |
      {{ LET summary BE SEND summarize_notes MESSAGE INPUT }}
      Summary preview: {{ USE summary }}

  using_block_value:
    description: Demonstrates `LET <label> BE ... END`.
    template: |
      {{ LET intro BE }}
           Dear team,
           Thank you for the timely updates today.
      {{ END }}
      {{ USE intro }}

  using_chain:
    description: Demonstrates chaining `LET` bindings.
    template: |
      {{ LET notes BE SEND gather_updates LIST INPUT }}
      {{ LET recap BE LIST USE notes AS LINES }}
      Daily recap:
      {{ USE recap }}
