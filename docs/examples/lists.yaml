agents:
  list_bullets:
    description: Default bullet output (`LIST <value>`).
    inputs:
      agenda:
        description: Structured agenda items supplied by the caller.
    template: |
      Agenda overview:
      {{ LIST INPUT agenda }}

  list_lines:
    description: Demonstrates `LIST <value> AS LINES`.
    inputs:
      agenda:
        description: Structured agenda items supplied by the caller.
    template: |
      Agenda as lines:
      {{ LIST INPUT agenda AS LINES }}

  list_paragraphs:
    description: Demonstrates `LIST <value> AS PARAGRAPHS`.
    inputs:
      agenda:
        description: Structured agenda items supplied by the caller.
    template: |
      Agenda as paragraphs:
      {{ LIST INPUT agenda AS PARAGRAPHS }}

  list_from_lines:
    description: Demonstrates reading a multi-line string (`FROM LINES`).
    template: |
      {{ LET notes BE }}
           Align roadmap
           Confirm staffing
      {{ END }}
      Formatted bullets:
      {{ LIST USE notes FROM LINES }}
