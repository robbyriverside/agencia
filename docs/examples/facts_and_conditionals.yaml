agents:
  ticket:
    description: Sample ticket data used in conditional examples.
    facts:
      owner:
        description: Account owner responsible for the ticket.
      last_contact:
        description: Timestamp of the last customer contact.
      status:
        description: Current ticket status.
      resolution_summary:
        description: Summary of the resolution provided to the customer.
      escalation_note:
        description: Notes used when escalating the ticket.
      priority:
        description: Ticket priority level.
      follow_up_needed:
        description: Whether a follow-up is required.
    template: |
      owner: Zhou
      last_contact: 123-555-2121
      status: Resolved
      resolution_summary: Customer confirmed the fix resolved the outage.
      escalation_note: Escalate to networking team if the outage returns.
      priority: High
      follow_up_needed: FALSE

  fact_lookup:
    description: Demonstrates `FACT <label> IN <label>` and bare `FACT <label>`.
    template: |
      Profile owner: {{ FACT owner IN ticket }}
      Last contact noted: {{ FACT last_contact IN ticket }}

  condition_inline:
    description: Demonstrates inline conditional `IF <predicate> THEN <value> ELSE <value>`.
    template: |
      {{ IF status IN ticket IS Resolved THEN FACT resolution_summary IN ticket ELSE FACT escalation_note IN ticket }}

  condition_block:
    description: Demonstrates block conditional `IF <predicate> THEN ... END` with an `ELSE ... END`.
    template: |
      {{ IF priority IN ticket IS High THEN }}
      Please escalate this ticket immediately.
      {{ ELSE }}
      Continue monitoring the ticket and report any changes.
      {{ END }}

  condition_block_else_if:
    description: Demonstrates block conditional with an `ELSE IF` branch inside the block.
    template: |
      {{ IF status IN ticket IS Closed THEN }}
      Close the incident and notify the team.
      {{ ELSE IF priority IN ticket IS High THEN }}
      Escalate to the on-call engineer and track updates.
      {{ ELSE }}
      Continue monitoring the ticket and provide status updates.
      {{ END }}

  condition_then_only:
    description: Demonstrates block conditional with no `ELSE`.
    template: |
      {{ IF follow_up_needed IN ticket IS TRUE THEN }}
      Schedule a follow-up call with the customer.
      {{ END }}

  condition_inline_else_if:
    description: Demonstrates inline conditional with `ELSE IF` expressions.
    template: |
      Ticket summary: {{ IF status IN ticket IS Resolved THEN FACT resolution_summary IN ticket ELSE IF priority IN ticket IS High THEN FACT escalation_note IN ticket ELSE FACT last_contact IN ticket }}
